// The Gradle build: for Android Studio (run, debug, profile) and ./gradlew assembleDebug / assembleRelease.
// build.sh is still how CI builds release/ZombieCitySandbox.apk, and test.sh runs the tests; both are unchanged.
// Gradle reads the same sources, resources and manifest, and writes everything under build/gradle/.
plugins {
    id 'com.android.application' version '8.13.2'
}

layout.buildDirectory = file('build/gradle')

// One manifest for both builds. build.sh's aapt needs its package attribute and <uses-sdk>; the Android Gradle
// plugin refuses both (they come from namespace, minSdk and targetSdk below). So Gradle reads the version and SDK
// levels from it and builds from a copy without them.
def manifestFile = file('AndroidManifest.xml')
def manifestText = manifestFile.getText('UTF-8')
def attr = { String name ->
    def m = manifestText =~ /android:${name}="([^"]+)"/
    if (!m.find()) throw new GradleException("AndroidManifest.xml has no android:${name}")
    m.group(1)
}
def gradleManifest = layout.buildDirectory.file('manifest/AndroidManifest.xml').get().asFile
def writeGradleManifest = {
    def stripped = manifestFile.getText('UTF-8').replaceFirst(/\s+package="[^"]*"/, '').replaceFirst(/(?s)\s*<uses-sdk[^>]*\/>/, '')
    gradleManifest.parentFile.mkdirs()
    if (!gradleManifest.exists() || gradleManifest.getText('UTF-8') != stripped) gradleManifest.setText(stripped, 'UTF-8')
}
// (Written now, for Android Studio's sync, and again before every build, as clean deletes it.)
writeGradleManifest()
def stripManifest = tasks.register('stripManifest') {
    description = 'Copies AndroidManifest.xml without package and <uses-sdk> for the Android Gradle plugin.'
    inputs.file(manifestFile)
    outputs.file(gradleManifest)
    doLast { writeGradleManifest() }
}
tasks.named('preBuild') { dependsOn(stripManifest) }

android {
    namespace = 'com.instantaxtion.zombiesandbox'
    compileSdk = 34

    defaultConfig {
        applicationId = 'com.instantaxtion.zombiesandbox'
        minSdk = attr('minSdkVersion') as int
        targetSdk = attr('targetSdkVersion') as int
        versionCode = attr('versionCode') as int
        versionName = attr('versionName')
    }

    sourceSets {
        main {
            manifest.srcFile(gradleManifest)
            java.srcDirs = ['src']
            res.srcDirs = ['res']
        }
    }

    // The same key as build.sh, so an APK from either installs over the other.
    signingConfigs {
        shared {
            storeFile = file('keystore/debug.keystore')
            storePassword = 'android'
            keyAlias = 'androiddebugkey'
            keyPassword = 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig = signingConfigs.shared
        }
        release {
            signingConfig = signingConfigs.shared
            // No R8: saved games read some classes' fields by name (VehicleSave), which renaming would break, and
            // the game has no libraries for shrinking to cut.
            minifyEnabled = false
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    lint {
        // Lint is there to read in Android Studio; it doesn't stop a build.
        abortOnError = false
        checkReleaseBuilds = false
    }
}

// The game's own tests and health check, as Gradle tasks (they run on a desktop JVM, as without Gradle).
tasks.register('gameTests', Exec) {
    group = 'verification'
    description = 'Runs ./test.sh (all 25 tests; FAST=1 for the fast tier).'
    commandLine './test.sh'
}
tasks.register('healthCheck', Exec) {
    group = 'verification'
    description = 'Runs tools/health.sh (a real game, compared with tools/health_baseline.txt).'
    commandLine 'tools/health.sh'
}
